name: Build PDF Drawing Tool

on:
  workflow_dispatch:
  push:
    paths:
      - 'pdf-drawing-tool/**'
      - '.github/workflows/build-pdf-drawing-tool.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf-drawing-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py fast_main.py pdf_ops.py

      - name: Build fast onedir app
        run: pyinstaller --noconfirm --clean --onedir --windowed --name "PDF Drawing Tool" fast_main.py

      - name: Smoke check built EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist\PDF Drawing Tool\PDF Drawing Tool.exe")) { throw "Built EXE not found" }
          Get-ChildItem "dist\PDF Drawing Tool" | Select-Object -First 10

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload portable app folder
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Drawing-Tool-V2.4-Portable
          path: pdf-drawing-tool/dist/PDF Drawing Tool/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Drawing-Tool-V2.4-Setup
          path: pdf-drawing-tool/installer_output/PDF_Drawing_Tool_Setup.exe
