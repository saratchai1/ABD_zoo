name: Build PDF Drawing Tool

on:
  workflow_dispatch:
  push:
    paths:
      - 'pdf-drawing-tool/**'
      - '.github/workflows/build-pdf-drawing-tool.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf-drawing-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py fast_main.py centered_main.py dark_theme.py pdf_ops.py

      - name: Performance regression check
        shell: powershell
        run: |
          python -c "import ast,inspect,textwrap,fast_main; src='\n'.join([inspect.getsource(fast_main.FastEditorTab.add_files),inspect.getsource(fast_main.FastEditorTab.rebuild_pages)]); tree=ast.parse(textwrap.dedent(src)); bad=[]; [bad.append('page_count') for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='page_count']; [bad.append('fitz.open') for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and isinstance(n.func.value,ast.Name) and n.func.value.id=='fitz' and n.func.attr=='open']; assert not bad, bad; print(fast_main.APP_NAME, 'async-load AST check OK')"

      - name: Sheet centering regression check
        shell: powershell
        run: |
          python -c "from centered_main import centered_write_box; d={'box_norm':[0.40,0.70,0.60,0.80],'number_box_norm':[0.51,0.71,0.59,0.79]}; w=centered_write_box(d); write_center=(w[0]+w[2])/2; erase_center=(d['number_box_norm'][0]+d['number_box_norm'][2])/2; assert abs(write_center-0.50)<1e-9, w; assert abs(erase_center-0.50)>0.01, erase_center; print('sheet center check OK: erase=',erase_center,'write=',write_center)"

      - name: Per-page export tracking regression check
        shell: powershell
        run: |
          python -c "import pdf_ops; ds={'p1':{'box_norm':[0.40,0.70,0.60,0.80],'number_box_norm':[0.51,0.71,0.59,0.79]},'p2':{'box_norm':[0.35,0.64,0.55,0.74],'number_box_norm':[0.46,0.65,0.54,0.73]}}; pdf_ops.detect_sheet_number_box_on_page=lambda p: ds[p]; auto={'type':'sheet_number','box':[0.46,0.71,0.54,0.79],'erase_box':[0.51,0.71,0.59,0.79],'follow_detected_cell':True}; a,ok1,fb1=pdf_ops._page_local_elements('p1',[auto],0); b,ok2,fb2=pdf_ops._page_local_elements('p2',[auto],1); c1=(a[0]['box'][0]+a[0]['box'][2])/2; c2=(b[0]['box'][0]+b[0]['box'][2])/2; assert ok1 and ok2 and not fb1 and not fb2; assert abs(c1-0.50)<1e-9 and abs(c2-0.45)<1e-9, (c1,c2); print('per-page export tracking OK:',c1,c2)"

      - name: Per-page live preview regression check
        shell: powershell
        run: |
          python -c "from centered_main import preview_effective_elements; auto={'type':'sheet_number','box':[0.46,0.71,0.54,0.79],'erase_box':[0.51,0.71,0.59,0.79],'follow_detected_cell':True}; p1={'box_norm':[0.40,0.70,0.60,0.80],'number_box_norm':[0.51,0.71,0.59,0.79]}; p2={'box_norm':[0.35,0.64,0.55,0.74],'number_box_norm':[0.46,0.65,0.54,0.73]}; a=preview_effective_elements([auto],p1); b=preview_effective_elements([auto],p2); c1=(a[0]['box'][0]+a[0]['box'][2])/2; c2=(b[0]['box'][0]+b[0]['box'][2])/2; assert abs(c1-0.50)<1e-9 and abs(c2-0.45)<1e-9 and a[0]['box'] != b[0]['box']; assert auto['box']==[0.46,0.71,0.54,0.79]; print('live preview tracking OK:',c1,c2)"

      - name: Dark theme regression check
        shell: powershell
        run: |
          python -c "import centered_main,dark_theme; q=dark_theme.DARK_STYLESHEET; assert 'V2.5.4' in centered_main.APP_NAME; assert '#11161d' in q; assert 'QPushButton[role=\"primary\"]' in q; assert 'QTabBar::tab:selected' in q; assert callable(dark_theme.install_dark_theme); print(centered_main.APP_NAME, 'dark-theme check OK')"

      - name: Responsive toolbar regression check
        shell: powershell
        run: |
          python -c "import inspect,centered_main; s=inspect.getsource(centered_main.CenteredEditorTab._install_responsive_toolbar); assert 'responsiveToolbarShell' in s; assert 'responsiveEditToolbar' in s; assert 'responsiveViewToolbar' in s; assert 'setFixedWidth' in s; assert 'setStretchFactor' in s; assert 'setMinimumWidth(560)' in s; print('responsive toolbar check OK')"

      - name: Build V2.5.4 Dark CAD responsive onedir app
        run: pyinstaller --noconfirm --clean --onedir --windowed --name "PDF Drawing Tool" centered_main.py

      - name: Smoke check built EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist\PDF Drawing Tool\PDF Drawing Tool.exe")) { throw "Built EXE not found" }
          Get-ChildItem "dist\PDF Drawing Tool" | Select-Object -First 10

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload portable app folder
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Drawing-Tool-V2.5.4-Dark-CAD-Responsive-Portable
          path: pdf-drawing-tool/dist/PDF Drawing Tool/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Drawing-Tool-V2.5.4-Dark-CAD-Responsive-Setup
          path: pdf-drawing-tool/installer_output/PDF_Drawing_Tool_Setup.exe
